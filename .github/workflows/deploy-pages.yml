# Deploy static FlowTransport til GitHub Pages via gh-pages branch
# (undgår actions/deploy-pages OIDC, som har fejlet med "No keys from key endpoint")
name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare site files
        run: |
          mkdir -p _site
          cp index.html style.css README.md _site/
          touch _site/.nojekyll
          cp -r js assets _site/

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          force_orphan: true
          commit_message: "Deploy FlowTransport site from main"
